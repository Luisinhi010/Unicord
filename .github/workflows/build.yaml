# This workflow will build, sign, and package Unicord for sideloading.

name: Build

on:
  workflow_dispatch:
  push:
    branches: [ redesign ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: Unicord.sln
      Project_Name: Unicord.Universal.Package
      Project_Name_2: Unicord.Universal
      ProjectFile_Name: Unicord.Universal.Package/Unicord.Universal.Package.wapproj
      BackgroundProjectFile_Name: Unicord.Universal.Background/Unicord.Universal.Background.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: |
        msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration /p:RuntimeIdentifier=win-x86
        msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration /p:RuntimeIdentifier=win-x64
        msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration /p:RuntimeIdentifier=win-arm
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Create local signing certificate
      shell: pwsh
      run: |
        $publisher = 'CN=0F22111D-EDF0-42F0-B58D-26C4C5C5054B'
        $password = [Guid]::NewGuid().ToString('N')
        $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

        $cert = New-SelfSignedCertificate `
          -Type Custom `
          -Subject $publisher `
          -KeyUsage DigitalSignature `
          -CertStoreLocation 'Cert:\CurrentUser\My' `
          -TextExtension @(
            '2.5.29.37={text}1.3.6.1.5.5.7.3.3',
            '2.5.29.19={text}'
          ) `
          -FriendlyName 'Unicord GitHub Actions Development Signing'

        $packageDir = Join-Path $env:GITHUB_WORKSPACE $env:Project_Name
        $appDir = Join-Path $env:GITHUB_WORKSPACE $env:Project_Name_2
        $pfxPath = Join-Path $packageDir 'GitHubActionsWorkflow.pfx'
        $cerPath = Join-Path $packageDir 'Unicord_LocalDev.cer'

        Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
        Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
        Copy-Item $pfxPath (Join-Path $appDir 'GitHubActionsWorkflow.pfx') -Force

        "AppxThumbprint=$($cert.Thumbprint)" >> $env:GITHUB_ENV
        "PfxPassword=$password" >> $env:GITHUB_ENV

        Write-Host "Created signing certificate: $($cert.Subject)"
        Write-Host "Thumbprint: $($cert.Thumbprint)"
        Write-Host "Valid until: $($cert.NotAfter)"

    - name: Adjust Package Version
      run: |
        $appx = 'http://schemas.microsoft.com/appx/manifest/foundation/windows10'
        $file = (Resolve-Path "$env:Project_Name/Package.appxmanifest")
        $xml = [System.Xml.XmlDocument]::new()
        $xml.Load($file)

        $nsmgr = [System.Xml.XmlNamespaceManager]::new($xml.NameTable)
        $nsmgr.AddNamespace("appx", $appx);

        $node = $xml.GetElementsByTagName("Identity", $appx)[0]
        $version = [System.Version]::Parse($node.GetAttribute("Version"))

        if ($env:Version -ne "Store") {
          $commitDate = Get-Date (git show -s --format=%ci)
          $epoch = ($commitDate - (Get-Date $commitDate.Date -Day 1))
          $version = [System.Version]::new($version.Major, $version.Minor, $version.Build, $epoch.TotalMinutes);
          $node.SetAttribute("Version", $version.ToString())
        }

        $xml.Save($file)

        echo "Appx_Bundle_Version=$($version.ToString())" >> $env:GITHUB_ENV
      env:
        Appx_Bundle_Version: ''
        Version: ''

    - name: Install legacy SDK (10.0.22621.2428)
      run: |
        echo Downloading...
        curl -L https://go.microsoft.com/fwlink/?linkid=2250105 -o winsdksetup.exe
        echo Installing...
        ./winsdksetup.exe /features + /q
        echo "Waiting for SDK to finish installing..."
        Wait-Process -Name "winsdksetup"
        echo Done!

    - name: Build App Packages
      run: msbuild $env:Solution_Name /t:Unicord_Universal_Package /p:Configuration=$env:Configuration /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode /p:AppxBundle=$env:Appx_Bundle /p:AppxBundlePlatforms="x86|x64|ARM" /p:PackageCertificateKeyFile=GitHubActionsWorkflow.pfx /p:PackageCertificatePassword=$env:PfxPassword /p:AppxPackageDir="$env:Appx_Package_Dir" /p:PackageCertificateThumbprint=$env:AppxThumbprint
      env:
        Appx_Bundle: Always
        Appx_Package_Build_Mode: SideloadOnly
        Appx_Package_Dir: Packages\
        Configuration: ${{ matrix.configuration }}

    - name: Include public certificate in artifact
      shell: pwsh
      run: |
        Copy-Item "$env:Project_Name\Unicord_LocalDev.cer" "$env:Project_Name\Packages\Unicord_LocalDev.cer" -Force

    - name: Cleanup private signing material
      if: always()
      shell: pwsh
      run: |
        Remove-Item "$env:Project_Name\GitHubActionsWorkflow.pfx" -ErrorAction SilentlyContinue
        Remove-Item "$env:Project_Name_2\GitHubActionsWorkflow.pfx" -ErrorAction SilentlyContinue

    - name: Upload Appx Package
      uses: actions/upload-artifact@v4
      with:
        name: AppxPackage-${{ env.Appx_Bundle_Version }}-${{ matrix.configuration }}
        path: |
          ${{ env.Project_Name }}\Packages
